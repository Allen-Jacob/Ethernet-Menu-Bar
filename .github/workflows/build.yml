name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Read version
        id: version
        run: echo "value=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ethernet-menu-bar.keychain-db"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          test -n "$IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app and disk image
        run: |
          chmod +x scripts/*.sh
          ./scripts/create-dmg.sh
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Ethernet Menu Bar.app" \
            "dist/Ethernet-Menu-Bar.zip"

      - name: Generate signed appcast and delta updates
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/create-appcast.sh

      - name: Sign and notarize disk image
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="dist/Ethernet-Menu-Bar.dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Ethernet-Menu-Bar-${{ steps.version.outputs.value }}
          path: |
            dist/Ethernet-Menu-Bar.dmg
            dist/Ethernet-Menu-Bar.zip
            dist/updates/appcast.xml
            dist/updates/*.delta
            dist/release-notes.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          SPARKLE_ASSETS=(dist/updates/*.delta)
          RELEASE_NOTES_ASSETS=(dist/updates/*.md)
          gh release create "$GITHUB_REF_NAME" \
            "dist/Ethernet-Menu-Bar.dmg" \
            "dist/Ethernet-Menu-Bar.zip" \
            "dist/updates/appcast.xml" \
            "${SPARKLE_ASSETS[@]}" \
            "${RELEASE_NOTES_ASSETS[@]}" \
            --title "Ethernet Menu Bar ${{ steps.version.outputs.value }}" \
            --notes-file "dist/release-notes.md"
